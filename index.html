<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Access All Areas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@300;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #0a0605; color: #f2eade; font-family: 'Oswald', sans-serif; }
  body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .stage { position: relative; width: 100%; max-width: 1280px; aspect-ratio: 16 / 9; }
  video { width: 100%; height: 100%; display: block; background: #0a0605; }
  .gate {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; background: radial-gradient(ellipse at center, #3a0508 0%, #0a0605 65%); border: 0; color: inherit;
    cursor: pointer; font: inherit; width: 100%; padding: 16px; box-sizing: border-box;
  }
  .gate .big { font-family: 'Anton', sans-serif; font-size: clamp(48px, 12vw, 120px); line-height: 1; color: #e8182a; letter-spacing: 2px; }
  .gate .small { font-weight: 300; font-size: clamp(13px, 2.4vw, 20px); letter-spacing: 6px; }
  .gate .play {
    width: clamp(64px, 12vw, 96px); height: clamp(64px, 12vw, 96px); border: 3px solid #e8182a; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; animation: beat 0.88s ease-in-out infinite;
  }
  .gate .play::after { content: ""; border-style: solid; border-width: 14px 0 14px 24px; border-color: transparent transparent transparent #f2eade; margin-left: 6px; }
  @keyframes beat { 0%, 100% { transform: scale(1); } 12% { transform: scale(1.12); } }
  .hidden { display: none; }
</style>
</head>
<body>
  <div class="stage">
    <video id="v" src="video.mp4" playsinline preload="auto"></video>
    <button class="gate" id="gate" aria-label="Play the video">
      <span class="small">ACCESS ALL AREAS</span>
      <span class="big">PRESS PLAY</span>
      <span class="play" aria-hidden="true"></span>
      <span class="small">VOLUME UP</span>
    </button>
  </div>
<script>
  const v = document.getElementById('v');
  const gate = document.getElementById('gate');
  gate.addEventListener('click', () => {
    gate.classList.add('hidden');
    v.play();
  });
  // Tap the video afterwards to watch it again
  v.addEventListener('click', () => { if (v.ended || v.paused) { v.currentTime = 0; v.play(); } });
</script>
</body>
</html>
